name: Build and Test Arrow Bottles Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Original Game Source Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify original game bundle
        run: |
          set -eu

          test -f www/index.html

          SIZE=$(wc -c < www/index.html)

          echo "Game bundle size: ${SIZE} bytes"

          if [ "$SIZE" -lt 500000 ]; then
            echo "ERROR: Original game bundle appears to be missing."
            exit 1
          fi

          grep -q 'window.AB' www/index.html
          grep -q 'js/meta/daily.js' www/index.html

          echo "Original game bundle validation passed."

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

  android-build:
    name: Build Android APK and AAB
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify required files
        run: |
          set -eu
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

          SIZE=$(wc -c < www/index.html)
          test "$SIZE" -gt 500000

          grep -q 'window.AB' www/index.html
          grep -q 'js/meta/daily.js' www/index.html

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Prepare web assets
        run: |
          set -eu

          # Never overwrite the original game bundle.
          test -f www/index.html

          # Copy optional files only if they are missing.
          for FILE in manifest.webmanifest sw.js; do
            if [ ! -f "www/$FILE" ] && [ -f "$FILE" ]; then
              cp "$FILE" "www/$FILE"
            fi
          done

          if [ -d assets ]; then
            cp -Rn assets/. www/ || true
          fi

          echo "Verified game bundle:"
          wc -c www/index.html

          find www -maxdepth 3 -type f

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android SDK configuration
        run: |
          grep -nE \
            'compileSdkVersion|targetSdkVersion|minSdkVersion' \
            android/variables.gradle

          grep -qE \
            'targetSdkVersion[[:space:]]*=[[:space:]]*36' \
            android/variables.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release app bundle
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrow-bottles-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
