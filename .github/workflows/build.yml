name: Build and Test Arrow Bottles Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Source smoke tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run source smoke tests
        run: npm test

  android-build:
    name: Build Android APK and AAB
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify required files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f index.html

      - name: Install dependencies
        run: npm install

      - name: Run source smoke tests
        run: npm test

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d assets ]; then cp -R assets www/; fi
          echo "Prepared web files:"
          find www -maxdepth 3 -type f

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android target SDK
        run: |
          echo "Generated SDK configuration:"
          grep -nE 'compileSdkVersion|targetSdkVersion|minSdkVersion' android/variables.gradle
          grep -qE 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release app bundle
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrow-bottles-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
