
name: Build Arrow Escape Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arrow-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Validate puzzles and countdown
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Generate web build
        run: npm run build:web

      - name: Verify native ad bridge
        run: test -s www/native-ads-bridge.js

  android-build:
    name: Build Android APK and AAB
    needs: source-tests
    runs-on: ubuntu-24.04

    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_REWARDED_UNIT_ID: ${{ secrets.ADMOB_REWARDED_UNIT_ID }}
      ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}
      ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
      ADMOB_PRODUCTION: ${{ vars.ADMOB_PRODUCTION }}

      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Install Capacitor and AdMob dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Generate native ad bridge and ad configuration
        run: |
          python3 scripts/configure_web_ads.py
          npm run build:web
          test -s www/index.html
          test -s www/native-ads-bridge.js
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
          python3 scripts/configure_android_ads.py

          grep -q 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml
          grep -qE 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -qE 'minSdkVersion[[:space:]]*=[[:space:]]*24' android/variables.gradle

      - name: Configure Android release signing
        run: python3 scripts/configure_android_signing.py

      - name: Build debug APK and release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Upload APK, AAB and configuration reports
        uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            www/ad-status.txt
            www/signing-status.txt
          if-no-files-found: error
          retention-days: 14
