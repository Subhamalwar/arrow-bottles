name: Build Android App

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Download repository files
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Step 3: Set up Java for Android
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 4: Verify required files
      - name: Verify Project Files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          echo "Required project files found."

      # Step 5: Install project dependencies
      - name: Install Dependencies
        run: npm install

      # Step 6: Prepare web assets
      - name: Prepare Web Assets
        run: |
          mkdir -p www

          cp index.html www/

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest www/
          fi

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

          if [ -d assets ]; then
            cp -R assets www/
          fi

          echo "Prepared web files:"
          find www -maxdepth 3 -type f

      # Step 7: Add Android platform if missing
      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # Step 8: Synchronize web assets with Android
      - name: Sync Capacitor
        run: npx cap sync android

      # Step 9: Build installable debug APK
      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # Step 10: Build Android App Bundle
      - name: Build Android App Bundle
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      # Step 11: Upload APK and AAB
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrow-bottles-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
